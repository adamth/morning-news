{% extends "base.html" %}
{% block title %}Sign in - Morning News{% endblock %}
{% block wrap_class %}mx-auto max-w-sm px-5 py-16{% endblock %}
{% block content %}
<div class="card">
  <h1 class="text-center">Morning<span class="text-accent-strong">News</span></h1>
  <p class="mt-2 text-center text-sm text-muted">Sign in to continue</p>
  {% if error %}<div class="flash flash-error mt-5 mb-0">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="mt-7">
    <div class="settings-fields">
      <div class="settings-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autofocus required />
      </div>
      <div class="settings-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-block">Sign in</button>
    </div>
  </form>
</div>
{% endblock %}
