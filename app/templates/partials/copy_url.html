{% macro copy_url(label, url, hint='', copy_label='') %}
<div class="url-field">
  <span class="url-label">{{ label }}</span>
  <div class="url-row">
    <span class="url-text">{{ url }}</span>
    <button
      type="button"
      class="url-copy btn-icon"
      data-copy-url
      aria-label="Copy {{ copy_label or label | lower }}"
    >
      <svg class="url-copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
      </svg>
      <svg class="url-copied-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    </button>
    <span class="sr-only url-copy-feedback" aria-live="polite"></span>
  </div>
  {% if hint %}<p class="field-hint">{{ hint | safe }}</p>{% endif %}
</div>
{% endmacro %}
