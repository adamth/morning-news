<nav class="settings-tabs" aria-label="Settings sections">
  <a
    href="/settings"
    class="settings-tab{% if settings_tab == 'show' %} is-active{% endif %}"
    {% if settings_tab == 'show' %}aria-current="page"{% endif %}
  >Your show</a>
  <a
    href="/settings/household"
    class="settings-tab{% if settings_tab == 'household' %} is-active{% endif %}"
    {% if settings_tab == 'household' %}aria-current="page"{% endif %}
  >Household</a>
  <a
    href="/settings/plumbing"
    class="settings-tab{% if settings_tab == 'plumbing' %} is-active{% endif %}"
    {% if settings_tab == 'plumbing' %}aria-current="page"{% endif %}
  >
    Plumbing
    {% if request.state.health_has_issues %}
    <span
      class="settings-tab-badge"
      title="{{ request.state.health_issue_count }} issue{{ 's' if request.state.health_issue_count != 1 else '' }}"
      aria-label="{{ request.state.health_issue_count }} issue{{ 's' if request.state.health_issue_count != 1 else '' }}"
    >!</span>
    {% endif %}
  </a>
</nav>
