services:
  morning-news:
    build: .
    platform: linux/amd64
    image: ${DOCKER_IMAGE:-morning-news:latest}
    container_name: morning-news
    restart: unless-stopped
    ports:
      # Host:Container. Change the host port if 8080 is taken on your Unraid box.
      - "8080:8080"
    volumes:
      # Named volume survives image rebuilds and fresh git checkouts. For a host
      # bind mount (e.g. Unraid appdata), copy docker-compose.override.example.yml
      # to docker-compose.override.yml and set your path there.
      - morning-news-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      # Optional: canonical public URL for RSS enclosures (otherwise derived per request).
      BASE_URL: "${BASE_URL:-}"
      # Long random string that signs login session cookies.
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET}"
      # API keys.
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      ZYTE_API_KEY: "${ZYTE_API_KEY:-}"
      NEWSDATA_API_KEY: "${NEWSDATA_API_KEY:-}"
      # First-run login (only used when no users exist yet).
      BOOTSTRAP_USERNAME: "${BOOTSTRAP_USERNAME:-}"
      BOOTSTRAP_PASSWORD: "${BOOTSTRAP_PASSWORD:-}"

volumes:
  morning-news-data:
    # Fixed name so the volume is reused even if the compose project name changes.
    name: morning-news-data
